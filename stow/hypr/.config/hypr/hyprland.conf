# Hyprland config (hyprlang, Hyprland 0.53+ — the version in Ubuntu 26.04).
# Hyprland 0.55+ also reads hyprland.lua; hyprlang keeps working for now.
# Wiki: https://wiki.hypr.land   Reload: hyprctl reload (auto on save)

# ---- monitors --------------------------------------------------------------
# `hyprctl monitors` to list. Example: monitor = DP-1, 2560x1440@144, 0x0, 1
monitor = , preferred, auto, auto
source = ~/.config/hypr/monitors.conf         # this machine's layout (tracked)
source = ~/.config/hypr/monitors.local.conf   # untracked, per-machine overrides

# ---- programs --------------------------------------------------------------
$terminal    = ghostty
$fileManager = nautilus
$browser     = google-chrome
$menu        = fuzzel
$scripts     = ~/.config/hypr/scripts

# ---- autostart -------------------------------------------------------------
exec-once = waybar
exec-once = mako
exec-once = hypridle
exec-once = bash $scripts/wallpaper.sh
exec-once = nm-applet --indicator
exec-once = systemctl --user start hyprpolkitagent
exec-once = wl-paste --watch cliphist store
exec-once = gsettings set org.gnome.desktop.interface color-scheme prefer-dark
exec-once = gsettings set org.gnome.desktop.interface gtk-theme Adwaita-dark

# ---- env -------------------------------------------------------------------
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = QT_QPA_PLATFORM,wayland;xcb
env = ELECTRON_OZONE_PLATFORM_HINT,auto   # Chrome/VS Code/Slack native Wayland

# ---- look (rosé pine) ------------------------------------------------------
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgb(c4a7e7) rgb(ebbcba) 45deg   # rosé pine iris → rose
    col.inactive_border = rgba(6e6a8666)
    resize_on_border = false
    layout = dwindle
}

decoration {
    rounding = 0
    shadow {
        enabled = false
    }
    blur {
        enabled = false
    }
}

group {
    col.border_active = rgb(c4a7e7) rgb(ebbcba) 45deg
    col.border_inactive = rgba(6e6a8666)
    groupbar {
        font_size = 12
        font_family = FiraCode Nerd Font
        height = 22
        indicator_height = 1
        gradients = true
        text_color = rgb(e0def4)
        col.active = rgba(c4a7e740)
        col.inactive = rgba(1f1d2e80)
    }
}

animations {
    enabled = true
    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    bezier = linear, 0, 0, 1, 1
    bezier = almostLinear, 0.5, 0.5, 0.75, 1
    bezier = quick, 0.15, 0, 0.1, 1
    animation = global, 1, 10, default
    animation = border, 1, 5.39, easeOutQuint
    animation = windows, 1, 3.79, easeOutQuint
    animation = windowsIn, 1, 4.1, easeOutQuint, popin 87%
    animation = windowsOut, 1, 1.49, linear, popin 87%
    animation = fadeIn, 1, 1.73, almostLinear
    animation = fadeOut, 1, 1.46, almostLinear
    animation = fade, 1, 3.03, quick
    animation = layers, 1, 3.81, easeOutQuint
    animation = layersIn, 1, 4, easeOutQuint, fade
    animation = layersOut, 1, 1.5, linear, fade
    animation = fadeLayersIn, 1, 1.79, almostLinear
    animation = fadeLayersOut, 1, 1.39, almostLinear
    animation = workspaces, 0
}

dwindle {
    pseudotile = true
    preserve_split = true
    force_split = 2          # new windows open right/below
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
    disable_scale_notification = true
    focus_on_activate = true
    vfr = true
}

# ---- input -----------------------------------------------------------------
input {
    kb_layout = tr                  # Turkish Q (TR-Q)
    kb_variant =
    kb_options =
    repeat_rate = 40
    repeat_delay = 250
    follow_mouse = 1
    sensitivity = 0
    touchpad {
        natural_scroll = true
        tap-to-click = true
        disable_while_typing = true
        middle_button_emulation = true
    }
}

gesture = 3, horizontal, workspace

# ---- keybindings: Omarchy's scheme (github.com/basecamp/omarchy), ported to hyprlang ----
# bindd = mods, key, DESCRIPTION, dispatcher, args  → Super+K lists them all.
$mod = SUPER

# apps
bindd = $mod, Return, Terminal, exec, $terminal
bindd = $mod ALT, Return, Terminal with tmux, exec, $terminal -e tmux new-session -A -s main
bindd = $mod SHIFT, Return, Browser, exec, $browser
bindd = $mod SHIFT, B, Browser, exec, $browser
bindd = $mod SHIFT ALT, B, Browser (private), exec, $browser --incognito
bindd = $mod SHIFT, F, File manager, exec, $fileManager
bindd = $mod SHIFT, N, Editor (nvim), exec, $terminal -e nvim
bindd = $mod SHIFT, D, Docker (lazydocker), exec, $terminal -e lazydocker
bindd = $mod SHIFT, A, ChatGPT, exec, chatgpt
bindd = $mod SHIFT ALT, A, Claude, exec, claude-desktop
bindd = $mod SHIFT, C, VS Code, exec, code
bindd = $mod CTRL, T, Activity (btop), exec, $terminal -e btop

# menus & system
bindd = $mod, Space, App launcher, exec, $menu
bindd = $mod ALT, Space, App launcher, exec, $menu
bindd = $mod, Escape, System menu (lock/sleep/reboot/shutdown/logout), exec, bash $scripts/powermenu.sh
bindld = , XF86PowerOff, System menu, exec, bash $scripts/powermenu.sh
bindd = $mod, K, Show keybindings, exec, bash $scripts/keybindings.sh
bindd = $mod CTRL, L, Lock screen, exec, loginctl lock-session
bindd = $mod SHIFT, Space, Toggle top bar, exec, pkill -SIGUSR1 waybar
bindd = $mod CTRL ALT, R, Reload Hyprland config, exec, hyprctl reload

# notifications (mako)
bindd = $mod, comma, Dismiss last notification, exec, makoctl dismiss
bindd = $mod SHIFT, comma, Dismiss all notifications, exec, makoctl dismiss --all
bindd = $mod ALT, comma, Invoke last notification, exec, makoctl invoke
bindd = $mod SHIFT ALT, comma, Restore last notification, exec, makoctl restore

# screenshots / picker
bindd = , Print, Screenshot region → clipboard, exec, bash $scripts/screenshot.sh region
bindd = SHIFT, Print, Screenshot full screen, exec, bash $scripts/screenshot.sh screen
bindd = $mod SHIFT, S, Screenshot region → clipboard, exec, bash $scripts/screenshot.sh region
bindd = $mod, Print, Color picker, exec, pkill hyprpicker || hyprpicker -a

# clipboard: Super+C/V/X copy/paste/cut in every app (terminals included)
bindd = $mod, C, Universal copy, sendshortcut, CTRL, Insert,
bindd = $mod, V, Universal paste, sendshortcut, SHIFT, Insert,
bindd = $mod, X, Universal cut, sendshortcut, CTRL, X,
bindd = $mod CTRL, V, Clipboard history, exec, cliphist list | fuzzel --dmenu --prompt 'clip  ' | cliphist decode | wl-copy

# windows
bindd = $mod, W, Close window, killactive
bindd = $mod, Q, Close window, killactive
bindd = $mod, J, Toggle split direction, layoutmsg, togglesplit
bindd = $mod, P, Pseudo tile, pseudo
bindd = $mod, T, Toggle floating, togglefloating
bindd = $mod, F, Fullscreen, fullscreen, 0
bindd = $mod ALT, F, Maximize (keeps bar), fullscreen, 1
bindd = $mod, O, Pop window out (float + pin), exec, hyprctl --batch 'dispatch togglefloating; dispatch pin'

# focus / swap
bindd = $mod, left, Focus left, movefocus, l
bindd = $mod, right, Focus right, movefocus, r
bindd = $mod, up, Focus up, movefocus, u
bindd = $mod, down, Focus down, movefocus, d
bindd = $mod SHIFT, left, Swap window left, swapwindow, l
bindd = $mod SHIFT, right, Swap window right, swapwindow, r
bindd = $mod SHIFT, up, Swap window up, swapwindow, u
bindd = $mod SHIFT, down, Swap window down, swapwindow, d
bindd = ALT, Tab, Next window, cyclenext
bindd = ALT, Tab, Bring it to front, alterzorder, top
bindd = ALT SHIFT, Tab, Previous window, cyclenext, prev
bindd = ALT SHIFT, Tab, Bring it to front, alterzorder, top
bindd = CTRL ALT, Tab, Next monitor, focusmonitor, +1
bindd = CTRL ALT SHIFT, Tab, Previous monitor, focusmonitor, -1

# resize — the two keys right of 0 (code:20/21; on TR-Q that's * and -)
bindde = $mod, code:20, Grow left, resizeactive, -100 0
bindde = $mod, code:21, Shrink left, resizeactive, 100 0
bindde = $mod SHIFT, code:20, Shrink up, resizeactive, 0 -100
bindde = $mod SHIFT, code:21, Grow down, resizeactive, 0 100
bindde = $mod ALT, code:20, Grow left a little, resizeactive, -25 0
bindde = $mod ALT, code:21, Shrink left a little, resizeactive, 25 0
bindde = $mod CTRL, code:20, Grow left a lot, resizeactive, -300 0
bindde = $mod CTRL, code:21, Shrink left a lot, resizeactive, 300 0

# workspaces (1-5 right screen, 6-10 left; see monitors.conf)
bindd = $mod, 1, Workspace 1, workspace, 1
bindd = $mod, 2, Workspace 2, workspace, 2
bindd = $mod, 3, Workspace 3, workspace, 3
bindd = $mod, 4, Workspace 4, workspace, 4
bindd = $mod, 5, Workspace 5, workspace, 5
bindd = $mod, 6, Workspace 6, workspace, 6
bindd = $mod, 7, Workspace 7, workspace, 7
bindd = $mod, 8, Workspace 8, workspace, 8
bindd = $mod, 9, Workspace 9, workspace, 9
bindd = $mod, 0, Workspace 10, workspace, 10
bindd = $mod SHIFT, 1, Move window to 1, movetoworkspace, 1
bindd = $mod SHIFT, 2, Move window to 2, movetoworkspace, 2
bindd = $mod SHIFT, 3, Move window to 3, movetoworkspace, 3
bindd = $mod SHIFT, 4, Move window to 4, movetoworkspace, 4
bindd = $mod SHIFT, 5, Move window to 5, movetoworkspace, 5
bindd = $mod SHIFT, 6, Move window to 6, movetoworkspace, 6
bindd = $mod SHIFT, 7, Move window to 7, movetoworkspace, 7
bindd = $mod SHIFT, 8, Move window to 8, movetoworkspace, 8
bindd = $mod SHIFT, 9, Move window to 9, movetoworkspace, 9
bindd = $mod SHIFT, 0, Move window to 10, movetoworkspace, 10
bindd = $mod SHIFT ALT, 1, Move window silently to 1, movetoworkspacesilent, 1
bindd = $mod SHIFT ALT, 2, Move window silently to 2, movetoworkspacesilent, 2
bindd = $mod SHIFT ALT, 3, Move window silently to 3, movetoworkspacesilent, 3
bindd = $mod SHIFT ALT, 4, Move window silently to 4, movetoworkspacesilent, 4
bindd = $mod SHIFT ALT, 5, Move window silently to 5, movetoworkspacesilent, 5
bindd = $mod SHIFT ALT, 6, Move window silently to 6, movetoworkspacesilent, 6
bindd = $mod SHIFT ALT, 7, Move window silently to 7, movetoworkspacesilent, 7
bindd = $mod SHIFT ALT, 8, Move window silently to 8, movetoworkspacesilent, 8
bindd = $mod SHIFT ALT, 9, Move window silently to 9, movetoworkspacesilent, 9
bindd = $mod SHIFT ALT, 0, Move window silently to 10, movetoworkspacesilent, 10
bindd = $mod, Tab, Next workspace, workspace, e+1
bindd = $mod SHIFT, Tab, Previous workspace, workspace, e-1
bindd = $mod CTRL, Tab, Last used workspace, workspace, previous
bindd = $mod, mouse_down, Next workspace, workspace, e+1
bindd = $mod, mouse_up, Previous workspace, workspace, e-1
bindd = $mod SHIFT ALT, left, Move workspace to left monitor, movecurrentworkspacetomonitor, l
bindd = $mod SHIFT ALT, right, Move workspace to right monitor, movecurrentworkspacetomonitor, r

# scratchpad
bindd = $mod, S, Toggle scratchpad, togglespecialworkspace, scratchpad
bindd = $mod ALT, S, Send window to scratchpad, movetoworkspacesilent, special:scratchpad

# groups (tabbed windows)
bindd = $mod, G, Toggle group, togglegroup
bindd = $mod ALT, G, Move window out of group, moveoutofgroup
bindd = $mod ALT, left, Move into group on left, moveintogroup, l
bindd = $mod ALT, right, Move into group on right, moveintogroup, r
bindd = $mod ALT, up, Move into group above, moveintogroup, u
bindd = $mod ALT, down, Move into group below, moveintogroup, d
bindd = $mod ALT, Tab, Next window in group, changegroupactive, f
bindd = $mod ALT SHIFT, Tab, Previous window in group, changegroupactive, b
bindd = $mod CTRL, left, Previous window in group, changegroupactive, b
bindd = $mod CTRL, right, Next window in group, changegroupactive, f

# mouse: Super+drag moves, Super+right-drag resizes
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# media / brightness (also work on the lock screen); Alt = fine steps
bindeld = , XF86AudioRaiseVolume, Volume up, exec, bash $scripts/volume.sh up
bindeld = , XF86AudioLowerVolume, Volume down, exec, bash $scripts/volume.sh down
bindeld = ALT, XF86AudioRaiseVolume, Volume up 1%, exec, bash $scripts/volume.sh up 1
bindeld = ALT, XF86AudioLowerVolume, Volume down 1%, exec, bash $scripts/volume.sh down 1
bindld = , XF86AudioMute, Mute, exec, bash $scripts/volume.sh mute
bindld = , XF86AudioMicMute, Mute microphone, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindeld = , XF86MonBrightnessUp, Brightness up, exec, brightnessctl -e4 -n2 set 5%+
bindeld = , XF86MonBrightnessDown, Brightness down, exec, brightnessctl -e4 -n2 set 5%-
bindld = , XF86AudioPlay, Play/pause, exec, playerctl play-pause
bindld = , XF86AudioPause, Play/pause, exec, playerctl play-pause
bindld = , XF86AudioNext, Next track, exec, playerctl next
bindld = , XF86AudioPrev, Previous track, exec, playerctl previous

# ---- window rules (0.53 block syntax) --------------------------------------
windowrule {
    name = suppress-maximize-events
    match:class = .*
    suppress_event = maximize
}

windowrule {
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false
    no_focus = true
}

windowrule {
    name = float-utilities
    match:class = ^(org.pulseaudio.pavucontrol|pavucontrol|nm-connection-editor|blueman-manager|xdg-desktop-portal-gtk)$
    float = yes
}

windowrule {
    name = pip
    match:title = ^(Picture-in-Picture|Picture in picture)$
    float = yes
    pin = yes
}
