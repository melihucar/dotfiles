# Hyprland config (hyprlang, Hyprland 0.53+ — the version in Ubuntu 26.04).
# Hyprland 0.55+ also reads hyprland.lua; hyprlang keeps working for now.
# Wiki: https://wiki.hypr.land   Reload: hyprctl reload (auto on save)

# ---- monitors --------------------------------------------------------------
# `hyprctl monitors` to list. Example: monitor = DP-1, 2560x1440@144, 0x0, 1
monitor = , preferred, auto, auto
source = ~/.config/hypr/monitors.conf         # this machine's layout (tracked)
source = ~/.config/hypr/monitors.local.conf   # untracked, per-machine overrides

# ---- programs --------------------------------------------------------------
$terminal    = ghostty
$fileManager = nautilus
$browser     = google-chrome
$menu        = fuzzel
$scripts     = ~/.config/hypr/scripts

# ---- autostart -------------------------------------------------------------
exec-once = waybar
exec-once = mako
exec-once = hypridle
exec-once = $scripts/wallpaper.sh
exec-once = nm-applet --indicator
exec-once = systemctl --user start hyprpolkitagent
exec-once = wl-paste --watch cliphist store
exec-once = gsettings set org.gnome.desktop.interface color-scheme prefer-dark
exec-once = gsettings set org.gnome.desktop.interface gtk-theme Adwaita-dark

# ---- env -------------------------------------------------------------------
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = QT_QPA_PLATFORM,wayland;xcb
env = ELECTRON_OZONE_PLATFORM_HINT,auto   # Chrome/VS Code/Slack native Wayland

# ---- look (rosé pine) ------------------------------------------------------
general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    col.active_border = rgb(c4a7e7) rgb(ebbcba) 45deg
    col.inactive_border = rgb(26233a)
    resize_on_border = true
    layout = dwindle
}

decoration {
    rounding = 8
    active_opacity = 1.0
    inactive_opacity = 0.96
    shadow {
        enabled = true
        range = 8
        render_power = 3
        color = rgba(1a1a1aee)
    }
    blur {
        enabled = true
        size = 4
        passes = 2
        vibrancy = 0.17
    }
}

animations {
    enabled = true
    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    bezier = quick, 0.15, 0, 0.1, 1
    animation = windows, 1, 4, easeOutQuint, popin 90%
    animation = fade, 1, 3, quick
    animation = border, 1, 5, easeOutQuint
    animation = workspaces, 1, 3, easeOutQuint, slide
    animation = layers, 1, 3, easeOutQuint, fade
}

dwindle {
    pseudotile = true
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
    focus_on_activate = true
    vfr = true
}

# ---- input -----------------------------------------------------------------
input {
    kb_layout = tr                  # Turkish Q (TR-Q)
    kb_variant =
    kb_options = caps:escape        # Caps Lock acts as Esc (remove to get Caps Lock back)
    repeat_rate = 40
    repeat_delay = 250
    follow_mouse = 1
    sensitivity = 0
    touchpad {
        natural_scroll = true
        tap-to-click = true
    }
}

gesture = 3, horizontal, workspace

# ---- keybindings -----------------------------------------------------------
$mod = SUPER

bind = $mod, Return, exec, $terminal
bind = $mod, Space, exec, $menu
bind = $mod, E, exec, $fileManager
bind = $mod, B, exec, $browser
bind = $mod, Q, killactive
bind = $mod SHIFT, E, exit
bind = $mod, Escape, exec, loginctl lock-session
bind = $mod, F, fullscreen, 1          # maximize (keeps bar)
bind = $mod SHIFT, F, fullscreen, 0    # real fullscreen
bind = $mod, T, togglefloating
bind = $mod, P, pseudo
bind = $mod, O, layoutmsg, togglesplit
bind = $mod, C, exec, cliphist list | fuzzel --dmenu --prompt 'clip  ' | cliphist decode | wl-copy
bind = $mod SHIFT, R, exec, hyprctl reload

# screenshots (grim + slurp): region -> clipboard, full -> file
bind = $mod SHIFT, S, exec, $scripts/screenshot.sh region
bind = , Print, exec, $scripts/screenshot.sh screen

# focus / move with vim keys (and arrows)
bind = $mod, H, movefocus, l
bind = $mod, J, movefocus, d
bind = $mod, K, movefocus, u
bind = $mod, L, movefocus, r
bind = $mod, left, movefocus, l
bind = $mod, down, movefocus, d
bind = $mod, up, movefocus, u
bind = $mod, right, movefocus, r
bind = $mod SHIFT, H, movewindow, l
bind = $mod SHIFT, J, movewindow, d
bind = $mod SHIFT, K, movewindow, u
bind = $mod SHIFT, L, movewindow, r

# resize
binde = $mod CTRL, H, resizeactive, -40 0
binde = $mod CTRL, J, resizeactive, 0 40
binde = $mod CTRL, K, resizeactive, 0 -40
binde = $mod CTRL, L, resizeactive, 40 0

# workspaces
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10
bind = $mod, Tab, workspace, previous
bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up, workspace, e-1

# scratchpad
bind = $mod, S, togglespecialworkspace, scratch
bind = $mod ALT, S, movetoworkspace, special:scratch

# mouse
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# media / brightness (work on lock screen too)
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl  = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl  = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = , XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-
bindl  = , XF86AudioPlay, exec, playerctl play-pause
bindl  = , XF86AudioPause, exec, playerctl play-pause
bindl  = , XF86AudioNext, exec, playerctl next
bindl  = , XF86AudioPrev, exec, playerctl previous

# ---- window rules (0.53 block syntax) --------------------------------------
windowrule {
    name = suppress-maximize-events
    match:class = .*
    suppress_event = maximize
}

windowrule {
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false
    no_focus = true
}

windowrule {
    name = float-utilities
    match:class = ^(org.pulseaudio.pavucontrol|pavucontrol|nm-connection-editor|blueman-manager|xdg-desktop-portal-gtk)$
    float = yes
}

windowrule {
    name = pip
    match:title = ^(Picture-in-Picture|Picture in picture)$
    float = yes
    pin = yes
}
