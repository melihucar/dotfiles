# Monitor layout for melih-ubuntu. Matched by model+serial (desc:), so it survives
# swapping cables/ports. `hyprctl monitors all` lists names and modes.
# Both are 27" 4K at 1.5x → each is 2560x1440 logical, placed side by side.
#
#   [ S2721QSA ][ S2722QC ]
#     left         right

monitor = desc:Dell Inc. DELL S2721QSA 71VJZY3, 3840x2160@60, 0x0, 1.5
monitor = desc:Dell Inc. DELL S2722QC CHG5J24, 3840x2160@60, 2560x0, 1.5

# workspaces 1-5 open on the left screen, 6-10 on the right
workspace = 1, monitor:desc:Dell Inc. DELL S2721QSA 71VJZY3, default:true
workspace = 2, monitor:desc:Dell Inc. DELL S2721QSA 71VJZY3
workspace = 3, monitor:desc:Dell Inc. DELL S2721QSA 71VJZY3
workspace = 4, monitor:desc:Dell Inc. DELL S2721QSA 71VJZY3
workspace = 5, monitor:desc:Dell Inc. DELL S2721QSA 71VJZY3
workspace = 6, monitor:desc:Dell Inc. DELL S2722QC CHG5J24, default:true
workspace = 7, monitor:desc:Dell Inc. DELL S2722QC CHG5J24
workspace = 8, monitor:desc:Dell Inc. DELL S2722QC CHG5J24
workspace = 9, monitor:desc:Dell Inc. DELL S2722QC CHG5J24
workspace = 10, monitor:desc:Dell Inc. DELL S2722QC CHG5J24

# XWayland apps (some Electron builds) look blurry when scaled; let them render at native size
xwayland {
    force_zero_scaling = true
}
