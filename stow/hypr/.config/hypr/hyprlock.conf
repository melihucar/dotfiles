general {
    hide_cursor = true
}

background {
    monitor =
    # like swaylock --image; falls back to the color below if the file is missing
    path = ~/Pictures/Wallpapers/current.jpg
    color = rgb(191724)
    blur_passes = 2
}

label {
    monitor =
    text = $TIME
    color = rgb(e0def4)
    font_size = 72
    font_family = FiraCode Nerd Font
    position = 0, 120
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 50
    outline_thickness = 2
    outer_color = rgb(f6c177)
    inner_color = rgb(1f1d2e)
    font_color = rgb(e0def4)
    check_color = rgb(f6c177)
    fail_color = rgb(eb6f92)
    placeholder_text = <i>password</i>
    fade_on_empty = false
    rounding = 8
    position = 0, -20
    halign = center
    valign = center
}
