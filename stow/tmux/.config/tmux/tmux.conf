# ~/.config/tmux/tmux.conf

# ---- basics ----------------------------------------------------------------
set -g prefix C-a
unbind C-b
bind C-a send-prefix

set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB,xterm-256color:RGB"
set -g mouse on
set -g history-limit 50000
set -g escape-time 0
set -g focus-events on           # nvim autoread
set -g set-clipboard on          # OSC52 copy to system clipboard
set -g set-titles on
set -g set-titles-string "#S / #W"
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g automatic-rename on
set -g detach-on-destroy off     # killing a session switches to another instead of exiting
setw -g mode-keys vi

bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"

# ---- splits / windows ------------------------------------------------------
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind -r C-h resize-pane -L 5
bind -r C-j resize-pane -D 5
bind -r C-k resize-pane -U 5
bind -r C-l resize-pane -R 5
bind -r < swap-window -t -1 \; previous-window
bind -r > swap-window -t +1 \; next-window
bind x kill-pane
bind q display-panes

# copy mode like vim
bind v copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"

# projects & scratch
bind f display-popup -E -w 60% -h 60% "tmux-sessionizer"
bind g display-popup -E -w 90% -h 90% -d "#{pane_current_path}" "lazygit"
bind s choose-tree -Zs

# C-h/j/k/l move between tmux panes AND nvim splits (vim-tmux-navigator).
# Clear screen is still available as prefix + C-l.
bind C-l send-keys C-l

# ---- look: rosé pine ------------------------------------------------------
set -g status-position top
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=#191724,fg=#908caa"
set -g status-left-length 40
set -g status-left "#[fg=#191724,bg=#ebbcba,bold] #S #[bg=#191724] "
set -g status-right "#[fg=#6e6a86]#{?client_prefix,#[fg=#f6c177]PREFIX ,}#[fg=#6e6a86]%a %d %b  #[fg=#e0def4]%H:%M "
setw -g window-status-format "#[fg=#6e6a86] #I #W "
setw -g window-status-current-format "#[fg=#191724,bg=#c4a7e7,bold] #I #W#{?window_zoomed_flag, 󰊓,} "
set -g pane-border-style "fg=#26233a"
set -g pane-active-border-style "fg=#c4a7e7"
set -g message-style "bg=#26233a,fg=#e0def4"
set -g mode-style "bg=#403d52,fg=#e0def4"
set -g popup-border-style "fg=#c4a7e7"
set -g popup-border-lines rounded

# ---- plugins (TPM: prefix + I to install, prefix + U to update) ------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

run '~/.config/tmux/plugins/tpm/tpm'
