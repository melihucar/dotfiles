# WirePlumber 0.5 (Ubuntu 26.04+). Sound out of the DELL S2722QC (Radeon HDMI 2).
# A profile you pick by hand is remembered and still wins; this is the fallback
# for a fresh install / wiped state.
monitor.alsa.rules = [
  {
    matches = [ { device.name = "alsa_card.pci-0000_0b_00.1" } ]
    actions = { update-props = { device.profile = "output:hdmi-stereo-extra1" } }
  }
  {
    matches = [ { node.name = "alsa_output.pci-0000_0b_00.1.hdmi-stereo-extra1" } ]
    # highest sink priority -> default output (docs advise <= 1500 for sinks)
    actions = { update-props = { priority.session = 1500 } }
  }
]
